services:

  backend:
    image: rakeshbulli/aiopshub-backend:${BACKEND_VERSION:-v1.2.0}
    container_name: aiopshub-backend
    depends_on:
      - db
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env

  db:
    image: postgres:18
    container_name: aiopshub-db
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
