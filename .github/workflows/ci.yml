name: AIOpsHub CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        working-directory: backend
        run: |
          python -m py_compile main.py
          python -m py_compile ai_analysis.py
          python -m py_compile monitor.py
          python -m py_compile database.py
          python -m py_compile models.py

      - name: Build Docker image
        run: |
          docker build -t aiopshub-backend:${{ github.sha }} ./backend

      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: aiopshub-backend:${{ github.sha }}
          format: table
          exit-code: "0"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag aiopshub-backend:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/aiopshub-backend:${{ github.sha }}
          docker tag aiopshub-backend:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/aiopshub-backend:latest

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/aiopshub-backend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/aiopshub-backend:latest