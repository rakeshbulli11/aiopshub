services:

  db:
    image: postgres:18
    container_name: aiopshub-db
    environment:
      POSTGRES_DB: aiopshub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: REMOVED_SECRET
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  backend:
    build: ./backend
    container_name: aiopshub-backend
    depends_on:
      - db
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:REMOVED_SECRET@db:5432/aiopshub

  prometheus:
    image: prom/prometheus:latest
    container_name: aiopshub-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: aiopshub-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  grafana_data: